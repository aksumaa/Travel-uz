version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: traveluz_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: traveluz
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d traveluz"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: traveluz_backend
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@postgres:5432/traveluz
      JWT_SECRET_KEY: super-secret-jwt-key-change-in-production-min-32-chars
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-your_anthropic_api_key}
      TELEGRAM_ENCRYPTION_KEY: secret_encryption_key_for_telegram_bot_tokens_32b!
      CORS_ORIGINS: http://localhost,http://localhost:5173,http://localhost:80
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  telegram_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: traveluz_telegram_worker
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@postgres:5432/traveluz
      TELEGRAM_ENCRYPTION_KEY: secret_encryption_key_for_telegram_bot_tokens_32b!
      TELEGRAM_WORKER_BOT_TOKEN: ${TELEGRAM_WORKER_BOT_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    command: python app/telegram_worker.py

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: traveluz_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
